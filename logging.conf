[loggers]
keys=root, refreshLogger, importLogger, scheduleLogger, scheduleProcessorLogger, taskIDLinkLogger, taskNameLinkLogger, taskLogger

[handlers]
keys=consoleHandler, fileHandler, sqlHandler

[formatters]
keys=simple

[logger_root]
level=INFO
handlers=

[logger_refreshLogger]
level=INFO
handlers=consoleHandler, fileHandler
qualname=refreshLogger
propagate=0

[logger_importLogger]
level=INFO
handlers=consoleHandler, fileHandler
qualname=importLogger
propagate=0

[logger_scheduleLogger]
level=INFO
handlers=consoleHandler, fileHandler
qualname=scheduleLogger
propagate=0

[logger_scheduleProcessorLogger]
level=INFO
handlers=consoleHandler, fileHandler
qualname=scheduleProcessorLogger
propagate=0

[logger_scheduleRunLogger]
level=INFO
handlers=consoleHandler, fileHandler
qualname=scheduleRunLogger
propagate=0

[logger_taskIDLinkLogger]
level=INFO
handlers=consoleHandler, fileHandler
qualname=taskIDLinkLogger
propagate=0

[logger_taskNameLinkLogger]
level=INFO
handlers=consoleHandler, fileHandler
qualname=taskNameLinkLogger
propagate=0

[logger_taskLogger]
level=INFO
handlers=consoleHandler, fileHandler
qualname=taskLogger
propagate=0

[logger_sqlLogger]
level=INFO
handlers=sqlHandler
qualname=sqlLogger
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simple
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
args=('ScheduleRefreshLog.txt', 'a')

[handler_sqlHandler]
class=SQLLogger.SQLServerHandler
level=INFO
formatter=simple

[formatter_simple]
format=%(asctime)s - %(levelname)s - %(message)s

